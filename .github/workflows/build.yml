name: Compila APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila
        run: gradle --no-daemon assembleRelease

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk TelecomandoTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TelecomandoTV
          path: TelecomandoTV.apk

      - name: Pubblica nella pagina Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Telecomando TV (build ${{ github.run_number }})
          files: TelecomandoTV.apk
          make_latest: true
